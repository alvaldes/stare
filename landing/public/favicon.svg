<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fa3db"/>
      <stop offset=".55" stop-color="#b3aee8"/>
      <stop offset="1" stop-color="#f1c2b0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Fountain-pen nib: breather hole plus a slit that runs out through the
         point, so the tip splits into two tines like a real nib. -->
    <mask id="nib" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <path d="M32 8c7 6 11 14 9 25l-9 19-9-19c-2-11 2-19 9-25z" fill="#fff"/>
      <circle cx="32" cy="30.1" r="2.6" fill="#000"/>
      <path d="M31.3 31h1.4v23h-1.4z" fill="#000"/>
    </mask>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1c2030" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#aurora)"/>
  <rect width="64" height="64" rx="15" fill="url(#sheen)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".6"/>
  <g transform="rotate(40 32 32)" filter="url(#lift)">
    <rect width="64" height="64" fill="#fff" mask="url(#nib)"/>
  </g>
</svg>
